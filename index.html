<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#edece5"><meta name="description" content="Maria Vitória e Guilherme convidam você para celebrar seu casamento.">
  <title>Maria Vitória & Guilherme | Nosso casamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
  :root{--ink:#323a2e;--olive:#727b57;--cream:#edece5;--edge:#d6d5c8;--muted:#858675}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--cream);font-family:'DM Sans',sans-serif;min-height:100svh;overflow-x:hidden}body:before{content:'';position:fixed;inset:0;pointer-events:none;opacity:.23;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.15'/%3E%3C/svg%3E")}main{min-height:100svh;display:grid;place-items:center;padding:22px 18px}.invite{position:relative;width:min(100%,620px);padding:32px 42px 36px;text-align:center;background:#f9f8f2;border:1px solid #dddbcb;box-shadow:0 24px 68px #54544417}.invite:before{content:'';position:absolute;inset:10px;border:1px solid #dad7c8;pointer-events:none}.leaf{width:99px;height:60px;margin:auto;color:#8b9876}.eyebrow{text-transform:uppercase;letter-spacing:.27em;font-size:10px;font-weight:700;color:var(--olive);margin-top:0}.names{font-family:'Great Vibes',cursive;font-size:clamp(43px,9vw,65px);font-weight:400;line-height:1.12;margin:20px 0 4px}.amp{font-family:'Playfair Display',serif;font-style:italic;color:#a3a58d;font-size:29px;vertical-align:9px;margin:0 5px}.divider{display:flex;align-items:center;justify-content:center;gap:14px;margin:18px auto;color:#9aa083}.divider:before,.divider:after{content:'';height:1px;background:#d4d4c5;width:77px}.date{display:flex;align-items:center;justify-content:center;gap:20px;margin:16px 0 24px}.date .day{font-family:'Playfair Display',serif;font-size:61px;line-height:1}.date .side{text-align:left;font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:600;line-height:1.85}.date .year{text-align:right}.smallline{height:30px;width:1px;background:#d4d4c5}.greet{font-family:'Playfair Display',serif;font-size:clamp(19px,4.6vw,23px);font-weight:500;margin:0 0 12px}.message{max-width:380px;font-size:13px;line-height:1.85;color:#72756a;margin:0 auto 25px}button{font-family:inherit;cursor:pointer;display:block;width:min(100%,355px);margin:0 auto;border:1px solid #697655;background:#697655;padding:17px 16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:white;font-size:11px;transition:.2s}button:not(:disabled):hover{background:#556143;transform:translateY(-1px)}button:disabled{opacity:.72;cursor:default}.status{min-height:26px;font-size:12px;margin:12px 0 0;color:var(--olive);line-height:1.5}.foot{font-family:'Playfair Display',serif;font-style:italic;color:#97998b;font-size:13px;margin:5px 0 0}.decor{position:absolute;left:15px;right:15px;display:flex;justify-content:space-between;bottom:15px;font-size:12px;color:#bebead;pointer-events:none}@media(max-width:440px){main{padding:13px}.invite{padding:26px 23px 29px}.invite:before{inset:8px}.leaf{width:80px;height:49px}.names{margin:15px 0 0}.divider{margin:12px auto}.date{margin:10px 0 16px;gap:15px}.date .day{font-size:52px}.message{margin-bottom:18px}.greet{margin-bottom:8px}button{padding:15px}.foot{font-size:12px}}
  </style>
</head>
<body><main><section class="invite" aria-label="Convite de casamento">
<svg class="leaf" viewBox="0 0 130 80" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M64 75C67 50 52 25 17 4M65 75c-3-25 12-50 48-71" stroke="currentColor" stroke-width="1.25"/><path d="M34 19C12 9 8 24 22 32c12 5 15-4 12-13ZM48 33C25 27 24 45 41 50c10 1 10-8 7-17ZM56 50C36 50 40 66 55 66c8-2 6-9 1-16ZM95 19c22-10 26 5 12 13-12 5-15-4-12-13ZM82 33c23-6 24 12 7 17-10 1-10-8-7-17ZM74 50c20 0 16 16 1 16-8-2-6-9-1-16Z" fill="currentColor" opacity=".54"/></svg>
<div class="eyebrow">Temos a alegria de convidar você</div>
<h1 class="names">Maria Vitória <span class="amp">&</span><br> Guilherme</h1>
<div class="divider">✦</div>
<div class="eyebrow">Nosso grande dia</div>
<div class="date"><span class="side">SÁBADO<br>DEZEMBRO</span><span class="smallline"></span><span class="day">12</span><span class="smallline"></span><span class="side year">2026<br>♥</span></div>
<h2 class="greet" id="greeting">Olá, convidado(a)!</h2>
<p class="message" id="message">Confirme sua presença no nosso dia especial para celebrarmos juntos essa união.</p>
<button id="confirm" disabled>Carregando convite...</button><p id="status" class="status" role="status" aria-live="polite"></p>
<p class="foot">Esperamos você para celebrar o amor!</p><div class="decor"><span>✧</span><span>✧</span></div>
</section></main>
<script>
const slug=decodeURIComponent(location.pathname.split('/').filter(Boolean)[0]||'');
const greeting=document.getElementById('greeting'),button=document.getElementById('confirm'),status=document.getElementById('status');
let nome='';
async function init(){
  if(!slug){greeting.textContent='Um dia para celebrar o amor';button.textContent='Abra seu convite pessoal';status.textContent='Utilize o link que recebeu dos noivos.';return;}
  try{const r=await fetch('/api/rsvp?slug='+encodeURIComponent(slug),{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Convite indisponível');nome=d.nome;greeting.textContent='Olá, '+nome+'!';if(d.confirmado){button.textContent='✓ Presença confirmada';button.disabled=true;status.textContent='Sua presença já está confirmada. Até o grande dia!';}else{button.textContent='Confirmar presença!';button.disabled=false}}
  catch(e){greeting.textContent='Não encontramos seu convite';button.textContent='Convite indisponível';status.textContent=e.message;}
}
button.addEventListener('click',async()=>{if(!nome)return;button.disabled=true;button.textContent='Confirmando...';status.textContent='';try{const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({slug})});const d=await r.json();if(!r.ok)throw Error(d.error||'Falha ao confirmar');button.textContent='✓ Presença confirmada';status.textContent='Que alegria! Sua presença foi confirmada com sucesso.';}catch(e){button.disabled=false;button.textContent='Tentar novamente';status.textContent=e.message;}});init();
</script></body></html>
